apiVersion: v1
kind: ConfigMap
metadata:
  name: wif-config
  namespace: default
data:
  PROJECT_NUMBER: "123456789012"
  POOL_ID: "universal-pool"
  PROVIDER_ID: "universal-jwt-provider"
  GSA_EMAIL: "testaccount@my-gcp-project.iam.gserviceaccount.com"
  MINIO_PORT: "9000"
  WIF_SERVER_PORT: "8080"
  BINARY_VERSION: "v1.0.0"
---
apiVersion: v1
kind: Secret
metadata:
  name: wif-secret
  namespace: default
type: Opaque
stringData:
  AGENT_SHARED_SECRET: "super-secret-passphrase"